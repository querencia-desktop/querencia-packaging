# Gebündelte Fremdarchive in vendorten Crates (QD-139). Ein Crate bringt hier
# den Quelltext eines anderen Projekts als Archiv mit, unter dessen eigenen
# Lizenzen. werkzeuge/copyright-erzeugen.py schreibt für jeden Treffer einen
# eigenen Absatz "Files: cargo-vendor/<crate>/<archiv>" nach dem Absatz des
# Crates (DEP-5: der spätere Absatz gilt). Ein Archiv in einem Crate, das hier
# fehlt und keine kleine Testdatei ist, bricht die Erzeugung ab;
# werkzeuge/pakete-pruefen.sh meldet es als FAIL.
#
# Spalten, durch Tabulatoren getrennt:
#   muster       fnmatch-Muster relativ zu cargo-vendor/
#   lizenz       SPDX-Ausdruck des Archivinhalts
#   copyright    Inhaber (DEP-5 Copyright:)
#   texte        SPDX=Pfad im Archiv, kommagetrennt, für Lizenztexte, die kein
#                Crate und /usr/share/common-licenses liefern; "-" für keine
#   kommentar    DEP-5 Comment:
#
# gettext-sys 0.27.0: GNU gettext 1.0 (gelesen 23.10.2026): COPYING und
# gettext-tools, libtextstyle GPL-3.0-or-later; gettext-runtime/intl und
# libasprintf LGPL-2.1-or-later; libxml-Kopien MIT; tree-sitter 0.23.2 und
# die Grammatiken d, go, ocaml, rust, typescript MIT; tree-sitter
# lib/src/unicode Unicode (ICU 58 and later). Mit dem Feature
# gettext-system (alle Querencia-Pakete) baut gettext-sys das Archiv nicht
# (build.rs), die Programme nehmen gettext aus der glibc.
gettext-sys-*/gettext-*.tar.xz	GPL-3.0-or-later AND LGPL-2.1-or-later AND MIT AND Unicode-3.0	1995-2026 Free Software Foundation, Inc.; the authors of libxml and tree-sitter (see the COPYING and LICENSE files inside the archive)	Unicode-3.0=gettext-1.0/gettext-tools/tree-sitter-0.23.2/lib/src/unicode/LICENSE	Source archive of GNU gettext, bundled by the gettext-sys crate. It is only built without the crate feature gettext-system; the Querencia packages enable that feature and use the gettext functions of the C library, so nothing from this archive is in the binary package.
