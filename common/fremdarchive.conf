# Gebündelte Fremdarchive in vendorten Crates (QD-139). Ein Crate bringt hier
# den Quelltext eines anderen Projekts als Archiv mit, unter dessen eigenen
# Lizenzen.
#   entfernen  werkzeuge/fremdarchive-entfernen.py löscht das Archiv beim
#              Vendoren (orig-erzeugen.sh) und streicht es aus der
#              .cargo-checksum.json; copyright-erzeugen.py hängt den
#              Kommentar an den Absatz des Crates.
#   absatz     das Archiv bleibt; copyright-erzeugen.py schreibt einen eigenen
#              Absatz "Files: cargo-vendor/<crate>/<archiv>" mit Lizenz und
#              Inhabern.
# Ein Archiv in einem Crate, das hier fehlt und keine kleine Testdatei ist,
# bricht copyright-erzeugen.py ab; werkzeuge/pakete-pruefen.sh meldet jedes
# verbliebene Fremdarchiv in cargo-vendor als FAIL.
#
# Spalten, durch Tabulatoren getrennt:
#   muster       fnmatch-Muster relativ zu cargo-vendor/
#   aktion       entfernen | absatz
#   lizenz       SPDX-Ausdruck des Archivinhalts (bei entfernen zur Auskunft)
#   copyright    Inhaber (bei absatz: DEP-5 Copyright:)
#   texte        SPDX=Pfad im Archiv für Lizenztexte, die kein Crate und
#                /usr/share/common-licenses liefern (nur absatz); "-" für keine
#   kommentar    DEP-5 Comment: (entfernen: Zusatz zum Absatz des Crates)
#
# gettext-sys 0.27.0 bringt GNU gettext 1.0 mit (gelesen 23.10.2026): COPYING,
# gettext-tools und libtextstyle GPL-3.0-or-later; gettext-runtime/intl und
# libasprintf LGPL-2.1-or-later; libxml-Kopien MIT; tree-sitter 0.23.2 und
# fünf Grammatiken MIT; tree-sitter lib/src/unicode Unicode (ICU 58 and
# later). Alle Querencia-Pakete bauen gettext-sys mit dem Feature
# gettext-system; build.rs entpackt das Archiv dann nie, die Programme nehmen
# gettext aus der glibc. Entscheidung der Status-Session 23.10.2026: entfernen.
gettext-sys-*/gettext-*.tar.xz	entfernen	GPL-3.0-or-later AND LGPL-2.1-or-later AND MIT AND Unicode-3.0	1995-2026 Free Software Foundation, Inc.; the authors of libxml and tree-sitter	-	The bundled GNU gettext source archive (gettext-1.0.tar.xz) is removed from this vendored copy and from its .cargo-checksum.json: the Querencia packages build gettext-sys with the feature gettext-system and use the gettext functions of the C library, so the archive is never used (see debian/README.source).
