# Querencia Dateien kommt aus dem Workspace querencia-runtime (wie
# querencia-shell); gebaut wird nur das Crate querencia-dateien mit seinen
# Bibliotheken querencia-dateiarbeit und querencia-oberflaeche (debian/rules,
# cargo -p). Das Quellarchiv enthält den ganzen Workspace, weil Cargo alle
# Mitglieder zum Auflösen braucht.
# Wie bei querencia-shell (QD-139): Arbeitsberichte, Belege und
# Prüfwerkzeuge der Entwicklungs-VM (mit Heimpfaden) nicht ins Quellarchiv;
# keine Bau-Eingaben. Dazu die Prüfwerkzeuge des Crates (werkzeug/: isolierte
# GUI-Läufe, Prüfrahmen mit Arbeitspfaden) – der Bau braucht src/, po/ und
# data/. Ausnahme seit Dateien 0.2.0: werkzeug/miniaturen/qd-pdf-miniatur ist
# Eingabe eines Tests beim Bau (PDF-Stellvertreter im Sandkasten, ohne Pfade
# der Entwicklungs-VM) und bleibt im Archiv.
ausschluss docs/**
ausschluss tools/**
ausschluss werkzeug/**
ausschluss crates/querencia-dateien/werkzeug/ansichten/**
ausschluss crates/querencia-dateien/werkzeug/netzwerk/**
ausschluss crates/querencia-dateien/werkzeug/pruefung/**
ausschluss crates/querencia-dateien/werkzeug/gui-tests.sh
ausschluss crates/querencia-dateien/werkzeug/i18n.py
ausschluss crates/querencia-dateien/werkzeug/miniaturen/szenarien/**
ausschluss crates/querencia-dateien/werkzeug/miniaturen/lauf.sh
ausschluss crates/querencia-dateien/werkzeug/miniaturen/material.sh
ausschluss crates/querencia-dateien/werkzeug/miniaturen/cache-pruefen.py
