# Querencia Webhülle (Repository querencia-nachrichten, Tag webhuelle/0.2.0)
# bindet die Runtime-Bibliotheken querencia-oberflaeche und
# querencia-dateiarbeit als Cargo-Pfadabhängigkeiten
# "../querencia-runtime/crates/…" ein (E11). Im Quellpaket liegt das Programm
# deshalb im Unterordner querencia-webhuelle/, der Runtime-Workspace als
# zweites Upstream-Archiv daneben (querencia-runtime/); die relativen Pfade
# bleiben unverändert (Muster: querencia-software). Gebaut wird nur das
# Programm mit diesen zwei Crates (debian/rules, --manifest-path).
# Runtime-Stand 801a016 = Quelle von querencia-shell 0.1.0~alpha10 (Alpha 3,
# besitzt die Kataloge der Bibliotheken); die zwei Crates sind dort
# byte-gleich mit dem Stand f9a3cda, gegen den die Webhülle gebaut und
# geprüft wurde (git diff leer).
unterordner querencia-webhuelle
komponente querencia-runtime  querencia-runtime  801a016d1096f99809eba1124813b8d04f4c74c7
# Nie ins Quellarchiv (beide Archive): Prüfwerkzeuge, Arbeitsberichte und
# Belege der Entwicklungs-VM (Arbeitspfade), keine Bau-Eingaben; dazu aus
# der Runtime Hintergründe, Fensterthema und Sitzungsdateien (nur
# querencia-shell und querencia-session brauchen sie).
ausschluss docs/**
ausschluss tools/**
ausschluss werkzeug/**
ausschluss crates/*/werkzeug/**
ausschluss .github/**
ausschluss data/hintergruende/**
ausschluss data/themes/**
ausschluss session/**
