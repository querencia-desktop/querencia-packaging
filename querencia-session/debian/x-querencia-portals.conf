# xdg-desktop-portal configuration for XDG_CURRENT_DESKTOP=X-Querencia
# (portals.conf(5)): xdg-desktop-portal-gtk first; interfaces without a gtk
# backend (e.g. Secret from gnome-keyring) from any other installed one.
# Without this file xdg-desktop-portal picks gtk only as a last-resort
# fallback and logs it for every interface (Pflichtprobe B6). Same content
# as session/querencia/xdg-desktop-portal/ in the runtime (G2-AI, live
# since 20.10. 14:08).
[preferred]
default=gtk;*
